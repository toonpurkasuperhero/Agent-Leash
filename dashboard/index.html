<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentLeash Console</title>
  <meta name="description" content="Least-privilege runtime control for AI agents">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cff'/%3E%3Cstop offset='1' stop-color='%2322c3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z' fill='url(%23g)'/%3E%3Cpath d='M11 16.5l3.2 3.2L21.5 12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { const t = localStorage.getItem("al-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/overview" aria-label="AgentLeash home">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
          <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#22c3ee"/></linearGradient></defs>
          <path d="M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z" fill="url(#bg)"/>
          <path d="M11 16.5l3.2 3.2L21.5 12" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span><b>AgentLeash</b><small>Least-privilege for AI agents</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="pill-status" id="llm-status" title="AI components">—</div>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme"></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Overview</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
